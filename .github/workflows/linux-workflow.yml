
name: Linux, build and test

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build configuration"
        required: true
        default: "Release"

env:
  BUILD_TYPE: Release
  BUILD_DIRECTORY: build
  INSTALL_DIRECTORY: dist

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt-get install libcurl4-gnutls-dev

    - name: Configure CMake
      run: cmake -S. -B ${{github.workspace}}/${{env.BUILD_DIRECTORY}} -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build ${{github.workspace}}/${{env.BUILD_DIRECTORY}} --config ${{env.BUILD_TYPE}}
    
    - name: Test
      working-directory: ${{github.workspace}}/${{env.BUILD_DIRECTORY}}/g.tests
      run: ctest -V

    - name: Install
      run: cmake --install ${{github.workspace}}/${{env.BUILD_DIRECTORY}} --prefix ${{github.workspace}}/${{env.INSTALL_DIRECTORY}}

    - name: Integration test
      working-directory: ${{github.workspace}}/${{env.INSTALL_DIRECTORY}}
      run: |
        export USD_RATE=$(bin/ccnv -f usd -a 100 -t usd | awk -F ': ' '{print $2}' | awk -F ']' '{print $1}')
        echo "USD_RATE: $USD_RATE"
        if [[ "${USD_RATE}" == "1.0"  || "${USD_RATE}" == "1" ]]; then
           exit 0
        else
           exit 1
        fi  

    - name: Run ccnv
      working-directory: ${{github.workspace}}/${{env.INSTALL_DIRECTORY}}
      run: bin/ccnv -f usd -a 10 -t eur
